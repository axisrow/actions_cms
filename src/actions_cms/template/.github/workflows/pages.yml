name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, requirements.txt, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # pick up the publish commit when called from publish.yml
      - uses: __ENGINE_REPO__@__ENGINE_REF__
        with:
          requirements: requirements.txt
          run: build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
