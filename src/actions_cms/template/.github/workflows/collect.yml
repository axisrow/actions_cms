name: Collect

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # re-collect right after a merged change to the sources
  push:
    branches: [main]
    paths:
      - cms.yaml
      - config/sources.yaml
      - config/sites.yaml
      - .github/workflows/collect.yml

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: __ENGINE_REPO__@__ENGINE_REF__
        with:
          run: collect
          commit: inbox
          commit-message: "inbox: {datetime}"
