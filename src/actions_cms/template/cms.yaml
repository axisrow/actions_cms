# actions_cms settings. Only `rubrics` is required; the commented values are the defaults.
generator: mkdocs-material

# rubric (front-matter `rubric:`) -> category shown on the site
rubrics:
  news: "__CAT_NEWS__"
  guide: "__CAT_GUIDE__"

