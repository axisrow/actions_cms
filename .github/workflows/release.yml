name: Release

# Sites pin the action by major version (`@v0`). Pushing a full version tag moves the major tag to it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/actions_cms/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major"
          git push --force origin "refs/tags/$major"
